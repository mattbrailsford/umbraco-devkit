<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830">
  <style id="theme"><!-- Example: paste the diagram stylesheet here, wrapped in CDATA --></style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead new" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="830"/>

  <!-- Actors -->
  <g class="node">
    <rect class="shape" x="20" y="20" width="120" height="52" rx="6"/>
    <text class="title" x="80" y="42">Editor</text>
    <text class="sub" x="80" y="60">backoffice user</text>
  </g>
  <g class="node">
    <rect class="shape" x="162" y="20" width="196" height="52" rx="6"/>
    <text class="title" x="260" y="42" font-size="12">wd-deliveries-dashboard</text>
    <text class="sub" x="260" y="60" font-size="11">+ context, repository, client</text>
  </g>
  <g class="node">
    <rect class="shape" x="376" y="20" width="208" height="52" rx="6"/>
    <text class="title" x="480" y="42" font-size="12">WebhookDeliveriesController</text>
    <text class="sub" x="480" y="60" font-size="11">Management API</text>
  </g>
  <g class="node">
    <rect class="shape" x="602" y="20" width="176" height="52" rx="6"/>
    <text class="title" x="690" y="42" font-size="12">IWebhookDeliveryService</text>
    <text class="sub" x="690" y="60" font-size="11">service</text>
  </g>
  <g class="node store">
    <path class="shape" d="M800,26 v40 a70,7 0 0 0 140,0 v-40"/>
    <ellipse class="lid" cx="870" cy="26" rx="70" ry="7"/>
    <text class="title" x="870" y="50" font-size="12">WebhookOutbox</text>
    <text class="sub" x="870" y="66" font-size="11">database</text>
  </g>

  <!-- Lifelines -->
  <path class="lifeline" d="M80,72 V750"/>
  <path class="lifeline" d="M260,72 V750"/>
  <path class="lifeline" d="M480,72 V750"/>
  <path class="lifeline" d="M690,72 V750"/>
  <path class="lifeline" d="M870,74 V750"/>

  <!-- Alt region -->
  <rect class="zone" x="30" y="352" width="920" height="386" rx="8"/>
  <text class="zone-title" x="42" y="370">alt</text>
  <text class="zone-note" x="276" y="370">[no row, or not DeadLettered]</text>
  <path class="lifeline" d="M30,482 H950"/>
  <text class="zone-note" x="276" y="500">[else: DeadLettered]</text>

  <!-- Activations -->
  <rect class="activation" x="254" y="130" width="12" height="598"/>
  <rect class="activation" x="474" y="170" width="12" height="456"/>
  <rect class="activation" x="474" y="676" width="12" height="36"/>
  <rect class="activation" x="684" y="260" width="12" height="336"/>
  <rect class="activation" x="864" y="300" width="12" height="32"/>
  <rect class="activation" x="864" y="538" width="12" height="28"/>

  <!-- Calls -->
  <g marker-end="url(#arrow)">
    <path class="edge" d="M80,130 H254"/>
    <path class="edge" d="M266,170 H474"/>
    <path class="edge" d="M486,198 H522 V224 H486"/>
    <path class="edge" d="M486,260 H684"/>
    <path class="edge" d="M696,300 H864"/>
    <path class="edge" d="M696,538 H864"/>
    <path class="edge" d="M266,676 H474"/>
  </g>
  <!-- Replies -->
  <g marker-end="url(#arrow)">
    <path class="edge return" d="M864,330 H696"/>
    <path class="edge return" d="M684,400 H486"/>
    <path class="edge return" d="M474,436 H266"/>
    <path class="edge return" d="M254,466 H80"/>
    <path class="edge return" d="M864,564 H696"/>
    <path class="edge return" d="M684,594 H486"/>
    <path class="edge return" d="M474,624 H266"/>
    <path class="edge return" d="M254,650 H80"/>
    <path class="edge return" d="M474,710 H266"/>
  </g>

  <!-- Labels -->
  <text class="edge-label" x="90" y="110">1. Resend on a</text>
  <text class="edge-label" x="90" y="123">DeadLettered row</text>

  <text class="edge-label mono" x="276" y="150">2. POST /{id}/resend</text>
  <text class="edge-label" x="276" y="163">via WdDeliveriesRepository</text>

  <text class="edge-label" x="530" y="206">3. auth policy check</text>
  <text class="edge-label mono" x="530" y="221">SectionAccessSettings</text>

  <text class="edge-label" x="496" y="253">4. resend(id)</text>

  <text class="edge-label" x="706" y="293">5. load row by id</text>
  <text class="edge-label" x="706" y="323">row (or none)</text>

  <text class="edge-label" x="496" y="393">6a. not found / not DeadLettered</text>
  <text class="edge-label" x="276" y="429">7a. 404 or 409 Conflict</text>
  <text class="edge-label" x="90" y="459">8a. error toast</text>

  <text class="edge-label" x="706" y="518">6. Status = Pending,</text>
  <text class="edge-label" x="706" y="531">Attempts = 0</text>
  <text class="edge-label" x="706" y="557">saved</text>
  <text class="edge-label" x="496" y="587">7. ok</text>
  <text class="edge-label" x="276" y="617">8. 204 No Content</text>
  <text class="edge-label" x="90" y="643">9. success toast</text>
  <text class="edge-label mono" x="276" y="669">10. GET / (refresh list)</text>
  <text class="edge-label" x="276" y="703">200, paged list</text>

  <!-- Closing note -->
  <g class="note">
    <rect class="shape" x="30" y="760" width="920" height="50" rx="6"/>
    <text x="46" y="781">The row is Pending again. WebhookDeliveryJob picks it up on its next run (every 10 s, SchedulingPublisher server only)</text>
    <text x="46" y="798">and sends it as a fresh delivery with attempts counted from 0.</text>
  </g>
</svg>
