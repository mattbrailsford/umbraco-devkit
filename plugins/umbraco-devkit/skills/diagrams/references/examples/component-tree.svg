<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690">
  <style id="theme"><!-- Example: paste the diagram stylesheet here, wrapped in CDATA --></style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead new" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="690"/>

  <text class="heading" x="20" y="30">Webhook deliveries dashboard: element tree and data path</text>

  <rect class="zone" x="20" y="44" width="600" height="580" rx="10"/>
  <text class="zone-title" x="32" y="66">Element tree (Lit + UUI)</text>

  <rect class="zone" x="640" y="44" width="300" height="580" rx="10"/>
  <text class="zone-title" x="652" y="66">Data path</text>
  <text class="zone-note" x="652" y="82">top calls down</text>

  <!-- Tree connectors (elbows) -->
  <g>
    <path class="edge" d="M58,128 V161 H76"/>
    <path class="edge" d="M94,176 V207 H112"/>
    <path class="edge" d="M130,222 V589 H148"/>
    <path class="edge" d="M130,253 H148"/>
    <path class="edge" d="M130,391 H148"/>
    <path class="edge" d="M166,268 V345 H184"/>
    <path class="edge" d="M166,299 H184"/>
    <path class="edge" d="M166,406 V437 H184"/>
    <path class="edge" d="M202,452 V536 H220"/>
    <path class="edge" d="M202,483 H220"/>
  </g>

  <!-- r0: manifest -->
  <g class="node new">
    <rect class="shape" x="40" y="84" width="250" height="44" rx="6"/>
    <text class="title" x="165" y="102">Dashboard manifest</text>
    <text class="sub" x="165" y="119">type: dashboard · Settings section</text>
  </g>

  <!-- r1: dashboard element -->
  <g class="node new">
    <rect class="shape" x="76" y="146" width="200" height="30" rx="6"/>
    <text class="title mono" x="176" y="165">wd-deliveries-dashboard</text>
  </g>

  <!-- r2: uui-box -->
  <g class="node">
    <rect class="shape" x="112" y="192" width="90" height="30" rx="6"/>
    <text class="title mono" x="157" y="211">uui-box</text>
  </g>
  <text class="edge-label" x="216" y="211">headline "Deliveries"</text>

  <!-- r3: filter bar -->
  <g class="note">
    <rect class="shape" x="148" y="238" width="110" height="30" rx="6"/>
    <text x="160" y="257">filter bar (layout)</text>
  </g>

  <!-- r4, r5 -->
  <g class="node">
    <rect class="shape" x="184" y="284" width="100" height="30" rx="6"/>
    <text class="title mono" x="234" y="303">uui-select</text>
  </g>
  <text class="edge-label" x="298" y="303">status filter</text>
  <g class="node">
    <rect class="shape" x="184" y="330" width="90" height="30" rx="6"/>
    <text class="title mono" x="229" y="349">uui-input</text>
  </g>
  <text class="edge-label" x="288" y="349">search</text>

  <!-- r6: table -->
  <g class="node">
    <rect class="shape" x="148" y="376" width="90" height="30" rx="6"/>
    <text class="title mono" x="193" y="395">uui-table</text>
  </g>
  <text class="edge-label" x="252" y="395">one page of deliveries</text>

  <!-- r7: row element, stacked to show repetition -->
  <g class="node new">
    <rect class="shape" x="190" y="416" width="140" height="30" rx="6"/>
    <rect class="shape" x="184" y="422" width="140" height="30" rx="6"/>
    <text class="title mono" x="254" y="441">wd-delivery-row</text>
  </g>
  <text class="edge-label" x="344" y="441">one per delivery</text>

  <!-- r8: tag -->
  <g class="node">
    <rect class="shape" x="220" y="468" width="90" height="30" rx="6"/>
    <text class="title mono" x="265" y="487">uui-tag</text>
  </g>
  <text class="edge-label" x="324" y="487">status: Pending, Delivered, DeadLettered</text>

  <!-- r9: resend button -->
  <g class="node">
    <rect class="shape" x="220" y="514" width="210" height="44" rx="6"/>
    <text class="title mono" x="325" y="532">uui-button "Resend"</text>
    <text class="sub" x="325" y="549">DeadLettered rows only</text>
  </g>

  <!-- r10: pagination -->
  <g class="node">
    <rect class="shape" x="148" y="574" width="130" height="30" rx="6"/>
    <text class="title mono" x="213" y="593">uui-pagination</text>
  </g>
  <text class="edge-label" x="292" y="593">changes page, reloads list</text>

  <!-- Data path -->
  <g class="node new">
    <rect class="shape" x="660" y="136" width="260" height="56" rx="6"/>
    <text class="title mono" x="790" y="158">WdDeliveriesContext</text>
    <text class="sub" x="790" y="178">list state, filter, page, resend()</text>
  </g>
  <g class="node new">
    <rect class="shape" x="660" y="230" width="260" height="52" rx="6"/>
    <text class="title mono" x="790" y="252">WdDeliveriesRepository</text>
    <text class="sub" x="790" y="270">repository</text>
  </g>
  <g class="node new">
    <rect class="shape" x="660" y="320" width="260" height="52" rx="6"/>
    <text class="title mono" x="790" y="342">WdDeliveriesServerDataSource</text>
    <text class="sub" x="790" y="360">server data source</text>
  </g>
  <g class="node">
    <rect class="shape" x="660" y="410" width="260" height="52" rx="6"/>
    <text class="title" x="790" y="432">Generated client</text>
    <text class="sub" x="790" y="450">from the Management API spec</text>
  </g>
  <g class="node">
    <rect class="shape" x="660" y="500" width="110" height="52" rx="6"/>
    <text class="title mono" x="715" y="522">GET /</text>
    <text class="sub" x="715" y="540">paged, by status</text>
  </g>
  <g class="node">
    <rect class="shape" x="780" y="500" width="140" height="52" rx="6"/>
    <text class="title mono" x="850" y="522">POST /{id}/resend</text>
    <text class="sub" x="850" y="540">204 · 404 · 409</text>
  </g>
  <text class="zone-note" x="660" y="574">both under /umbraco/management/api/v1/</text>
  <text class="zone-note" x="660" y="589">webhook-deliveries</text>

  <g marker-end="url(#arrow)">
    <path class="edge" d="M790,192 V230"/>
    <path class="edge" d="M790,282 V320"/>
    <path class="edge" d="M790,372 V410"/>
    <path class="edge" d="M715,462 V500"/>
    <path class="edge" d="M850,462 V500"/>
  </g>
  <text class="edge-label" x="798" y="215">uses</text>
  <text class="edge-label" x="798" y="305">calls</text>
  <text class="edge-label" x="798" y="395">calls</text>

  <!-- Context provide / consume -->
  <g marker-end="url(#arrow)">
    <path class="edge dashed" d="M276,161 H660"/>
    <path class="edge dashed" d="M430,536 H630 V180 H660"/>
  </g>
  <text class="edge-label" x="290" y="154">provides context</text>
  <text class="edge-label" x="444" y="529">consumes, calls resend()</text>

  <!-- Legend -->
  <g class="legend">
    <rect class="shape" x="20" y="642" width="190" height="24" rx="12"/>
    <text x="115" y="658">Highlighted = this package</text>
  </g>
  <g class="node">
    <rect class="shape" x="222" y="642" width="190" height="24" rx="12"/>
    <text class="sub" x="317" y="658">Plain = UUI or generated</text>
  </g>
  <text class="footnote" x="426" y="658">Dashed arrows: Umbraco context API (provide, consume)</text>
</svg>
