  </g>
  <g class="note">
    <rect class="shape" x="700" y="510" width="220" height="56" rx="6"/>
    <text class="mono" x="810" y="534" text-anchor="middle">Microsoft.EntityFrameworkCore</text>
    <text class="mono" x="810" y="550" text-anchor="middle">.SqlServer</text>
  </g>
  <g class="note">
    <rect class="shape" x="700" y="630" width="220" height="56" rx="6"/>
    <text class="mono" x="810" y="654" text-anchor="middle">Microsoft.EntityFrameworkCore</text>
    <text class="mono" x="810" y="670" text-anchor="middle">.Sqlite</text>
  </g>

  <g marker-end="url(#arrow)">
