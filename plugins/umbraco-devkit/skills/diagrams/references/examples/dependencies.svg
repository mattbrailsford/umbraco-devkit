    <path class="edge" d="M580,86 V270"/>
    <path class="edge" d="M360,58 H18 V418 H370"/>
    <path class="edge" d="M368,206 V270"/>
    <path class="edge" d="M500,206 V390"/>
    <path class="edge" d="M530,206 V298 H560"/>
    <path class="edge" d="M590,326 V390"/>
    <path class="edge" d="M760,326 V390"/>
    <path class="edge" d="M630,326 V538 H700"/>
    <path class="edge" d="M800,298 H940 V658 H920"/>
    <path class="edge" d="M490,446 V510"/>
    <path class="edge" d="M140,206 V270"/>
