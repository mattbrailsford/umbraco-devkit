<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <style id="theme"><!-- Example: paste the diagram stylesheet here, wrapped in CDATA --></style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead new" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="720"/>
  <g class="node">
    <rect class="shape" x="360" y="30" width="240" height="56" rx="6"/>
    <text class="title" x="480" y="54">Umbraco.Webhooks</text>
    <text class="sub" x="480" y="72">NuGet package users install</text>
  </g>
  <g class="node">
    <rect class="shape" x="40" y="150" width="200" height="56" rx="6"/>
    <text class="title" x="140" y="174">Umbraco.Webhooks.Client</text>
    <text class="sub" x="140" y="192">Lit backoffice bundle</text>
  </g>
  <g class="node">
    <rect class="shape" x="310" y="150" width="240" height="56" rx="6"/>
    <text class="title" x="430" y="174">Umbraco.Webhooks.Web</text>
    <text class="sub" x="430" y="192">Management API, composer</text>
  </g>
  <g class="node store">
    <rect class="shape" x="40" y="270" width="200" height="56" rx="6"/>
    <text class="title" x="140" y="294">@umbraco-cms/backoffice</text>
    <text class="sub" x="140" y="312">npm</text>
  </g>
  <g class="node store">
    <rect class="shape" x="252" y="270" width="232" height="56" rx="6"/>
    <text class="title" x="368" y="303">Umbraco.Cms.Api.Management</text>
    
  </g>
  <g class="node">
    <rect class="shape" x="560" y="270" width="240" height="56" rx="6"/>
