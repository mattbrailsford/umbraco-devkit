    <text class="sub" x="680" y="312">EF Core WebhookDbContext</text>
  </g>
  <g class="node">
    <rect class="shape" x="370" y="390" width="240" height="56" rx="6"/>
    <text class="title" x="490" y="414">Umbraco.Webhooks.Core</text>
    <text class="sub" x="490" y="432">services, models</text>
  </g>
  <g class="node store">
    <rect class="shape" x="650" y="390" width="270" height="56" rx="6"/>
