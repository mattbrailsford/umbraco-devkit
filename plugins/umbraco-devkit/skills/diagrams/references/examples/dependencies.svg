  <text class="edge-label center" x="275" y="168">ships as</text>
  <text class="edge-label center" x="275" y="196">static files</text>
  <text class="edge-label" x="148" y="242">npm dependency</text>

  <g class="legend-key">
    <g class="node"><rect class="shape" x="40" y="560" width="40" height="22" rx="4"/></g>
    <text class="footnote" x="92" y="575">Project in this solution</text>
    <g class="node store"><rect class="shape" x="40" y="594" width="40" height="22" rx="4"/></g>
    <text class="footnote" x="92" y="609">Umbraco CMS package</text>
    <g class="note"><rect class="shape" x="40" y="628" width="40" height="22" rx="4"/></g>
    <text class="footnote" x="92" y="643">Third-party package</text>
    <path class="edge" d="M40,673 H80" marker-end="url(#arrow)"/>
    <text class="footnote" x="92" y="677">references (points at the dependency)</text>
    <path class="edge dashed" d="M40,700 H80" marker-end="url(#arrow)"/>
    <text class="footnote" x="92" y="704">built separately, shipped inside</text>
  </g>
