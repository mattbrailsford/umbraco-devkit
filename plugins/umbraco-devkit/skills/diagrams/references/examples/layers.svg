<svg xmlns="http://www.w3.org/2000/svg" width="960" height="980" viewBox="0 0 960 980">
  <style id="theme"><!-- Example: paste the diagram stylesheet here, wrapped in CDATA --></style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead new" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="980"/>

  <!-- Bands -->
  <rect class="band" x="20" y="20" width="920" height="202" rx="8"/>
  <text class="band-title" x="36" y="42">Backoffice (Lit + UUI)</text>

  <rect class="band" x="20" y="252" width="920" height="136" rx="8"/>
  <text class="band-title" x="36" y="274">Management API</text>

  <rect class="band" x="20" y="418" width="680" height="190" rx="8"/>
  <text class="band-title" x="36" y="440">Services</text>

  <rect class="band" x="20" y="638" width="680" height="100" rx="8"/>
  <text class="band-title" x="36" y="660">Persistence</text>

  <rect class="band" x="20" y="768" width="920" height="116" rx="8"/>
  <text class="band-title" x="36" y="790">Database</text>

  <!-- Background column -->
  <rect class="zone" x="716" y="418" width="224" height="254" rx="10"/>
  <text class="zone-title" x="730" y="438">Background work</text>
  <text class="zone-note" x="730" y="454">no HTTP request; enters at Services</text>

  <g class="legend">
    <rect class="shape" x="640" y="28" width="284" height="24" rx="12"/>
    <text x="782" y="44">Highlighted = one request, dashboard to tables</text>
  </g>

  <!-- Backoffice -->
  <g class="node">
    <rect class="shape" x="40" y="60" width="210" height="52" rx="6"/>
    <text class="title" x="145" y="82">wd-deliveries-dashboard</text>
    <text class="sub" x="145" y="100">Settings section</text>
  </g>
  <g class="node">
    <rect class="shape" x="290" y="60" width="220" height="52" rx="6"/>
    <text class="title" x="400" y="82">WdDeliveriesContext</text>
    <text class="sub" x="400" y="100">state, provided by dashboard</text>
  </g>
  <g class="node">
    <rect class="shape" x="550" y="60" width="240" height="52" rx="6"/>
    <text class="title" x="670" y="91">WdDeliveriesRepository</text>
  </g>
  <g class="node">
    <rect class="shape" x="550" y="150" width="240" height="52" rx="6"/>
    <text class="title" x="670" y="181">WdDeliveriesServerDataSource</text>
  </g>
  <g class="node">
    <rect class="shape" x="290" y="150" width="220" height="52" rx="6"/>
    <text class="title" x="400" y="172">Generated API client</text>
    <text class="sub" x="400" y="190">Management API client</text>
  </g>

  <!-- Management API -->
  <g class="node">
    <rect class="shape" x="230" y="284" width="340" height="88" rx="6"/>
    <text class="title" x="400" y="304">WebhookDeliveriesController</text>
    <text class="sub" x="400" y="322">/umbraco/management/api/v1/webhook-deliveries</text>
    <text class="sub" x="400" y="340">GET /   ·   POST /{id}/resend</text>
    <text class="sub" x="400" y="358">SectionAccessSettings policy</text>
  </g>

  <!-- Services -->
  <g class="node">
    <rect class="shape" x="300" y="456" width="200" height="52" rx="6"/>
    <text class="title" x="400" y="478">IWebhookDeliveryService</text>
    <text class="sub" x="400" y="496">list, resend</text>
  </g>
  <g class="node">
    <rect class="shape" x="530" y="456" width="160" height="52" rx="6"/>
    <text class="title" x="610" y="478">WebhookSender</text>
    <text class="sub" x="610" y="496">HttpClient POST</text>
  </g>
  <g class="node">
    <rect class="shape" x="530" y="536" width="160" height="52" rx="6"/>
    <text class="title" x="610" y="558">PayloadSigner</text>
    <text class="sub" x="610" y="576">HMAC-SHA256</text>
  </g>

  <!-- Background nodes -->
  <g class="node">
    <rect class="shape" x="730" y="470" width="190" height="52" rx="6"/>
    <text class="title" x="825" y="492" font-size="12">ContentPublishedNotification</text>
    <text class="sub" x="825" y="510">handler, any server</text>
  </g>
  <g class="node">
    <rect class="shape" x="730" y="536" width="190" height="52" rx="6"/>
    <text class="title" x="825" y="558">WebhookDeliveryJob</text>
    <text class="sub" x="825" y="576">10 s, SchedulingPublisher</text>
  </g>
  <g class="node">
    <rect class="shape" x="730" y="602" width="190" height="52" rx="6"/>
    <text class="title" x="825" y="624">WebhookCleanupJob</text>
    <text class="sub" x="825" y="642">nightly, rows &gt; 30 days</text>
  </g>

  <!-- Persistence -->
  <g class="node">
    <rect class="shape" x="40" y="670" width="200" height="52" rx="6"/>
    <text class="title" x="140" y="692">Migration plan</text>
    <text class="sub" x="140" y="710">EF Core migrations, startup</text>
  </g>
  <g class="node">
    <rect class="shape" x="300" y="670" width="200" height="52" rx="6"/>
    <text class="title" x="400" y="692">WebhookDbContext</text>
    <text class="sub" x="400" y="710">EF Core</text>
  </g>

  <!-- Database -->
  <g class="node store">
    <path class="shape" d="M60,812 v48 a85,8 0 0 0 170,0 v-48"/>
    <ellipse class="lid" cx="145" cy="812" rx="85" ry="8"/>
    <text class="title" x="145" y="844">WebhookEndpoint</text>
  </g>
  <g class="node store">
    <path class="shape" d="M280,812 v48 a85,8 0 0 0 170,0 v-48"/>
    <ellipse class="lid" cx="365" cy="812" rx="85" ry="8"/>
    <text class="title" x="365" y="844">WebhookSubscription</text>
  </g>
  <g class="node store">
    <path class="shape" d="M500,812 v48 a85,8 0 0 0 170,0 v-48"/>
    <ellipse class="lid" cx="585" cy="812" rx="85" ry="8"/>
    <text class="title" x="585" y="844">WebhookOutbox</text>
  </g>
  <g class="node store">
    <path class="shape" d="M720,812 v48 a85,8 0 0 0 170,0 v-48"/>
    <ellipse class="lid" cx="805" cy="812" rx="85" ry="8"/>
    <text class="title" x="805" y="844">WebhookLog</text>
  </g>

  <!-- Plain edges -->
  <path class="edge" d="M920,496 H932 V696"/>
  <path class="edge" d="M920,562 H932"/>
  <path class="edge" d="M920,628 H932"/>
  <g marker-end="url(#arrow)">
    <path class="edge" d="M730,548 H708 V482 H690"/>
    <path class="edge" d="M730,572 H690"/>
    <path class="edge" d="M932,696 H500"/>
    <path class="edge" d="M240,696 H300"/>
    <path class="edge" d="M400,752 H145 V802"/>
    <path class="edge" d="M365,752 V802"/>
    <path class="edge" d="M585,752 H805 V802"/>
  </g>
  <path class="edge" d="M400,722 V752"/>

  <!-- Request path -->
  <g marker-end="url(#arrow-new)">
    <path class="edge new" d="M250,86 H290"/>
    <path class="edge new" d="M510,86 H550"/>
    <path class="edge new" d="M670,112 V150"/>
    <path class="edge new" d="M550,176 H510"/>
    <path class="edge new" d="M400,202 V284"/>
    <path class="edge new" d="M400,372 V456"/>
    <path class="edge new" d="M400,508 V670"/>
    <path class="edge new" d="M400,722 V752 H585 V802"/>
  </g>

  <!-- Labels -->
  <text class="edge-label new" x="408" y="242">HTTP</text>
  <text class="edge-label new" x="408" y="408">list / resend</text>
  <text class="edge-label new" x="408" y="626">read / update</text>
  <text class="edge-label" x="248" y="688">applies</text>
  <text class="edge-label" x="512" y="688">insert, pick, update, delete rows</text>

  <!-- Registration -->
  <g class="note">
    <rect class="shape" x="20" y="904" width="920" height="60" rx="6"/>
    <text x="36" y="924" font-weight="700">Registration (startup wiring, not calls)</text>
    <text x="36" y="942">WebhooksComposer : IComposer registers the services, the publish handler and both jobs.</text>
    <text x="36" y="958">umbraco-package.json → backoffice bundle → bundle manifests → dashboard.</text>
  </g>
</svg>
