name: Checks

# The repo's model-free checks (see "No build, lint, or test step" in CLAUDE.md), run on
# every PR so they don't depend on someone remembering to. Evals are not run here: they make
# real model calls and cost money.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Full history: check-version.sh diffs against the merge base with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manifests parse
        run: |
          jq . .claude-plugin/marketplace.json > /dev/null
          jq . plugins/umbraco-devkit/.claude-plugin/plugin.json > /dev/null

      - name: Skill references
        run: scripts/check-skill-refs.sh

      - name: Skill wiring
        run: scripts/check-skill-wiring.sh

      - name: Version
        run: scripts/check-version.sh origin/main

      - name: Frontmatter
        run: scripts/check-frontmatter.sh

      - name: Skill callers
        run: scripts/check-skill-callers.sh

      - name: Evals
        run: scripts/check-evals.sh

      - name: Skill scripts
        run: scripts/check-skill-scripts.sh

      # A warning, not a failure: some skill changes can't affect behavior. CI can't run evals.
      - name: Eval scores recorded
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          if grep -qE '^plugins/umbraco-devkit/(skills|agents)/' <<<"$changed" &&
             ! grep -qx 'docs/eval-scores.json' <<<"$changed"; then
            echo "::warning::A skill or agent changed but docs/eval-scores.json didn't. Rerun the evals that cover the change and record them with scripts/record-eval-scores.sh, unless the change can't affect behavior."
          fi

      # Fails if docs/EVAL-COVERAGE.md is stale, and shows it on the run's summary page.
      - name: Eval coverage
        run: |
          scripts/eval-coverage.sh --check
          cat docs/EVAL-COVERAGE.md >> "$GITHUB_STEP_SUMMARY"

  # The scripts and hooks the plugin ships run on consumers' machines, which are Windows and
  # macOS as often as Linux, so their tests run on both too. The job above covers Linux.
  skill-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Skill scripts
        run: python -m unittest discover -s scripts/tests
